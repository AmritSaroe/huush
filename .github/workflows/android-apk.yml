name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build-debug-apk:
    name: Assemble debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web bundle
        run: pnpm run build:web

      - name: Sync Capacitor Android project
        run: pnpm exec cap sync android

      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Prepare named APK
        run: |
          mkdir -p artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk artifacts/Huush-Android-debug.apk
          file artifacts/Huush-Android-debug.apk
          unzip -tq artifacts/Huush-Android-debug.apk

      - name: Upload named APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: huush-android-debug-apk
          path: artifacts/Huush-Android-debug.apk
          if-no-files-found: error
          retention-days: 14
